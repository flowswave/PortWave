name: Core C++20
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure pure C++ core (no Qt)
        run: cmake -S . -B build -DPORTWAVE_BUILD_GUI=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
